# Helm values for Grafana Loki
#
# Layer: observability log storage
#
# Purpose:
# - Receive logs from Grafana Alloy.
# - Store Kubernetes, OTP Relay app, and OTP monitor logs.
# - Keep a small, local-retention log store for operational troubleshooting.
#
# Validated chart policy:
# - Current validated chart: grafana-community/loki chart 7.3.0.
# - Do not use deploymentMode: Monolithic with this chart in this repo.
#   In the fresh-install test, Monolithic rendered no Loki workload objects.
# - Use deploymentMode: SingleBinary for this small K3s cluster.
#
# Placement policy:
# - Loki is intentionally single-replica.
# - It is pinned to the observability data worker through:
#     observability/role: data
# - The PVC uses local-path and ReadWriteOnce because Loki is not part of the
#   OTP delivery critical path.
#
# Retention policy:
# - Keep logs for 7 days.
# - This is enough for recent troubleshooting without overloading a small cluster.
#
# SCH alignment:
# - Matches the SCH observability direction: Prometheus + Grafana + Loki + Alloy.
# - Keeps Loki simple and local for this cluster size.
# - Does not expose Loki directly outside the cluster.

deploymentMode: SingleBinary

singleBinary:
  replicas: 1

  nodeSelector:
    observability/role: data

  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 512Mi
      cpu: 300m

  persistence:
    enabled: true
    storageClass: local-path
    accessModes:
      - ReadWriteOnce
    size: 5Gi

# Disable distributed/microservices-mode components. This repo runs Loki as a
# small-cluster single-binary deployment.
backend:
  replicas: 0

read:
  replicas: 0

write:
  replicas: 0

ingester:
  replicas: 0

querier:
  replicas: 0

queryFrontend:
  replicas: 0

queryScheduler:
  replicas: 0

distributor:
  replicas: 0

compactor:
  replicas: 0

indexGateway:
  replicas: 0

bloomCompactor:
  replicas: 0

bloomGateway:
  replicas: 0

# Cache subcharts are unnecessary for this small cluster.
chunksCache:
  enabled: false

resultsCache:
  enabled: false

# Disable the chart test pod.
test:
  enabled: false

# Grafana talks to Loki directly through the Loki service. Traefik does not
# expose Loki externally.
gateway:
  enabled: false

# Disable synthetic Loki traffic generation.
lokiCanary:
  enabled: false

loki:
  auth_enabled: false

  commonConfig:
    replication_factor: 1
    path_prefix: /var/loki

  storage:
    type: filesystem
    filesystem:
      chunks_directory: /var/loki/chunks
      rules_directory: /var/loki/rules

  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h

  limits_config:
    retention_period: 168h
    reject_old_samples: true
    reject_old_samples_max_age: 168h

  compactor:
    retention_enabled: true
    delete_request_store: filesystem
    working_directory: /var/loki/compactor

  # Prometheus owns alerting. Loki ruler API is not required for this repo.
  rulerConfig:
    enable_api: false

  analytics:
    reporting_enabled: false
